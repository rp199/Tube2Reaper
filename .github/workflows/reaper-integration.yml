name: REAPER integration

on:
  workflow_dispatch:
  push:
    paths:
      - "Tube2Reaper.lua"
      - "lua/session.lua"
      - "tests/reaper_integration.lua"
      - "Install-Windows.ps1"
      - ".github/workflows/reaper-integration.yml"
  pull_request:
    paths:
      - "Tube2Reaper.lua"
      - "lua/session.lua"
      - "tests/reaper_integration.lua"
      - "Install-Windows.ps1"
      - ".github/workflows/reaper-integration.yml"

permissions:
  contents: read

env:
  REAPER_VERSION_PATH: "780"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install portable REAPER
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'reaper-install.exe'
          $portable = Join-Path $env:RUNNER_TEMP 'REAPER-portable'
          Invoke-WebRequest -UseBasicParsing `
            "https://www.reaper.fm/files/7.x/reaper$($env:REAPER_VERSION_PATH)_x64-install.exe" `
            -OutFile $installer
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          $install = Start-Process -FilePath $installer `
            -ArgumentList @('/S', '/PORTABLE', "/D=$portable") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "REAPER installer failed: $($install.ExitCode)" }
          if (-not (Test-Path (Join-Path $portable 'reaper.exe'))) { throw 'reaper.exe was not installed' }
          "REAPER_PORTABLE=$portable" | Out-File $env:GITHUB_ENV -Append
      - name: Install Tube2Reaper and run the harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\Install-Windows.ps1 -ReaperResourcePath $env:REAPER_PORTABLE -SkipHelpers
          $moduleRoot = Join-Path $env:REAPER_PORTABLE 'Scripts\Tube2Reaper'
          $work = Join-Path $env:RUNNER_TEMP 'tube2reaper-integration'
          $result = Join-Path $work 'result.txt'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $ini = @('[REAPER]', 'lastproject=', '[verchk]', "lastt=$now", '[audioconfig]', 'mode=0')
          $resourcePaths = @($env:REAPER_PORTABLE, (Join-Path $env:APPDATA 'REAPER'))
          foreach ($resourcePath in $resourcePaths) {
            New-Item -ItemType Directory -Force -Path (Join-Path $resourcePath 'Scripts') | Out-Null
            Set-Content -LiteralPath (Join-Path $resourcePath 'reaper.ini') `
              -Value $ini -Encoding ASCII
          }
          $env:TUBE2REAPER_MODULE_ROOT = $moduleRoot
          $env:TUBE2REAPER_CI_ROOT = $work
          $env:TUBE2REAPER_CI_RESULT = $result
          $reaper = Join-Path $env:REAPER_PORTABLE 'reaper.exe'
          $harness = Join-Path $env:GITHUB_WORKSPACE 'tests\reaper_integration.lua'
          $warmup = Start-Process -FilePath $reaper `
            -ArgumentList @('-new', '-nosplash', '-noactivate') -PassThru
          Start-Sleep -Seconds 20
          if (-not $warmup.HasExited) {
            & taskkill.exe /IM reaper.exe /T 2>$null | Out-Null
            if (-not $warmup.WaitForExit(10000)) {
              & taskkill.exe /F /IM reaper.exe /T 2>$null | Out-Null
            }
          }
          foreach ($resourcePath in $resourcePaths) {
            Copy-Item -LiteralPath $harness `
              -Destination (Join-Path $resourcePath 'Scripts\__startup.lua')
          }
          $process = Start-Process -FilePath $reaper `
            -ArgumentList @('-new', '-nosplash') -PassThru
          $keyboard = New-Object -ComObject WScript.Shell
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            if ((Test-Path -LiteralPath $result) -or $process.HasExited) { break }
            if (($attempt % 5) -eq 0 -and $keyboard.AppActivate($process.Id)) {
              Start-Sleep -Milliseconds 250
              $keyboard.SendKeys('{ENTER}')
            }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path -LiteralPath $result)) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Get-ChildItem -LiteralPath $work -Recurse -ErrorAction SilentlyContinue
            throw 'REAPER did not write a test result'
          }
          $message = Get-Content -LiteralPath $result -Raw
          Write-Host $message
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id -Force
          }
          if (-not $message.StartsWith('PASS ')) { throw $message }
          if (-not (Test-Path (Join-Path $work 'session\Tube2Reaper.rpp'))) {
            throw 'REAPER did not save the project'
          }

  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install REAPER and run the harness
        shell: bash
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/reaper.dmg"
          mount="$RUNNER_TEMP/reaper-mount"
          app="$RUNNER_TEMP/REAPER.app"
          work="$RUNNER_TEMP/tube2reaper-integration"
          result="$work/result.txt"
          mkdir -p "$mount" "$work"
          curl --fail --location --retry 3 \
            "https://www.reaper.fm/files/7.x/reaper${REAPER_VERSION_PATH}_universal.dmg" \
            --output "$dmg"
          echo Y | hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          cp -R "$mount/REAPER.app" "$app"
          hdiutil detach "$mount"
          now=$(date +%s)
          printf '[REAPER]\nlastproject=\ncoreaudioindevnew=<none>\ncoreaudiooutdevnew=<none>\n[verchk]\nlastt=%s\n' "$now" \
            >"$work/reaper.ini"
          resource="$HOME/Library/Application Support/REAPER"
          mkdir -p "$resource/Scripts"
          cp "$GITHUB_WORKSPACE/tests/reaper_integration.lua" "$resource/Scripts/__startup.lua"
          cp "$work/reaper.ini" "$resource/reaper.ini"
          export TUBE2REAPER_MODULE_ROOT="$GITHUB_WORKSPACE"
          export TUBE2REAPER_CI_ROOT="$work"
          export TUBE2REAPER_CI_RESULT="$result"
          "$app/Contents/MacOS/REAPER" \
            -newinst -cfgfile "$work/reaper.ini" -new -nosplash -noactivate \
            >"$work/warmup.log" 2>&1 &
          warmup_pid=$!
          sleep 20
          kill "$warmup_pid" 2>/dev/null || true
          for _ in {1..10}; do
            if ! kill -0 "$warmup_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -9 "$warmup_pid" 2>/dev/null || true
          wait "$warmup_pid" 2>/dev/null || true
          "$app/Contents/MacOS/REAPER" \
            -newinst -cfgfile "$work/reaper.ini" -new -nosplash \
            >"$work/reaper.log" 2>&1 &
          reaper_pid=$!
          for _ in {1..90}; do
            if [[ -f "$result" ]] || ! kill -0 "$reaper_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ ! -f "$result" ]]; then
            screencapture -x "$work/screen.png" || true
            kill "$reaper_pid" 2>/dev/null || true
            cat "$work/reaper.log"
            exit 1
          fi
          for _ in {1..15}; do
            if ! kill -0 "$reaper_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$reaper_pid" 2>/dev/null; then
            kill "$reaper_pid" 2>/dev/null || true
          fi
          wait "$reaper_pid" || true
          message=$(cat "$result")
          echo "$message"
          [[ "$message" == PASS\ * ]]
          test -f "$work/session/Tube2Reaper.rpp"
      - name: Upload REAPER diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reaper-macos-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/tube2reaper-integration/
          if-no-files-found: ignore
          retention-days: 3
